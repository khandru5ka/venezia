<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Схема центра — Венеция</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0f0d0a;
  --muted:#7a6e62;
  --cream:#faf8f3;
  --sand:#f0e9dc;
  --gold:#c6a15b;
  --gold-d:#a47c3e;
  --gold-p:#fdf6eb;
  --bordo:#4A0B18;
  --deep:#1f3e48;
  --rule:rgba(198,161,91,0.18);
  --tr:.2s ease;
  /* zone colours */
  --z-fashion:rgba(53,107,165,0.22);
  --z-fashion-h:rgba(53,107,165,0.42);
  --z-gastro:rgba(186,117,23,0.22);
  --z-gastro-h:rgba(186,117,23,0.42);
  --z-wellness:rgba(15,110,86,0.22);
  --z-wellness-h:rgba(15,110,86,0.42);
  --z-beauty:rgba(153,53,86,0.22);
  --z-beauty-h:rgba(153,53,86,0.42);
  --z-food:rgba(99,56,6,0.18);
  --z-food-h:rgba(99,56,6,0.36);
  --z-service:rgba(95,94,90,0.15);
  --z-service-h:rgba(95,94,90,0.3);
  --z-parking:rgba(44,44,42,0.12);
  --z-parking-h:rgba(44,44,42,0.25);
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Raleway',sans-serif;background:var(--cream);color:var(--ink);}

/* ── NAV ── */
.nav{background:rgba(250,248,243,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);position:relative;z-index:100;}
.navbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:62px;max-width:100%;padding:0 24px;}
.nav-l a,.nav-r a{font-size:13px;font-weight:500;letter-spacing:.05em;color:var(--muted);text-decoration:none;transition:var(--tr);}
.nav-l a:hover,.nav-r a:hover{color:var(--bordo);}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.18em;color:var(--bordo);text-decoration:none;text-align:center;}
.nav-r{display:flex;justify-content:flex-end;align-items:center;gap:20px;}
.burger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;width:26px;}
.burger span{display:block;height:1.5px;background:var(--ink);border-radius:2px;}
.side{position:fixed;top:0;right:-300px;width:270px;height:100%;background:#fffdf9;z-index:500;transition:right .35s cubic-bezier(.77,0,.18,1);padding:70px 0 32px;box-shadow:-4px 0 32px rgba(0,0,0,.08);}
.side.open{right:0;}
.side a{display:block;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--bordo);text-decoration:none;padding:13px 28px;border-bottom:1px solid var(--rule);transition:var(--tr);}
.side a:hover{padding-left:36px;}
.side-close{position:absolute;top:18px;right:20px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:400;display:none;}
.ov.open{display:block;}

/* ── SEARCH BAR ── */
.search-bar{background:#fff;border-bottom:1px solid var(--rule);padding:10px 20px;display:flex;align-items:center;gap:10px;position:relative;}
.sb-icon{color:var(--muted);flex-shrink:0;}
.sb-input{flex:1;border:none;background:transparent;font-family:'Raleway',sans-serif;font-size:14px;color:var(--ink);outline:none;}
.sb-input::placeholder{color:rgba(122,110,98,.45);}
.sb-clear{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;display:none;}
.sb-clear.vis{display:block;}
.sb-quick{display:flex;gap:6px;padding:8px 20px 10px;background:#fff;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;}
.sb-quick::-webkit-scrollbar{display:none;}
.sq-btn{background:var(--sand);border:none;padding:5px 14px;font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--muted);cursor:pointer;white-space:nowrap;transition:var(--tr);}
.sq-btn:hover{background:var(--gold-p);color:var(--bordo);}
/* autocomplete */
.ac-drop{position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--rule);z-index:50;display:none;max-height:240px;overflow-y:auto;}
.ac-drop.vis{display:block;}
.ac-item{padding:10px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid var(--rule);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover{background:var(--gold-p);}
.ac-name{font-size:13px;color:var(--ink);}
.ac-floor{font-size:11px;color:var(--muted);}

/* ── MAIN LAYOUT ── */
.page-body{display:flex;height:calc(100vh - 62px - 88px);overflow:hidden;}

/* ── FLOOR SWITCHER ── */
.floor-switcher{width:72px;flex-shrink:0;background:#fff;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:8px 0;overflow-y:auto;gap:2px;}
.floor-btn{width:52px;height:48px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:var(--tr);border-radius:4px;}
.floor-btn:hover{background:var(--sand);}
.floor-btn.active{background:var(--bordo);color:#fff;}
.floor-btn.active .fb-num{color:#fff;}
.floor-btn.active .fb-label{color:rgba(255,255,255,.65);}
.fb-num{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--bordo);line-height:1;}
.fb-label{font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1;text-align:center;}
.floor-sep{width:32px;height:1px;background:var(--rule);margin:4px auto;}

/* ── PLAN AREA ── */
.plan-area{flex:1;overflow:hidden;position:relative;background:var(--cream);}
.plan-canvas{width:100%;height:100%;position:relative;}
.floor-plan{display:none;width:100%;height:100%;padding:20px;}
.floor-plan.active{display:flex;align-items:center;justify-content:center;}
.plan-svg{max-width:700px;width:100%;max-height:100%;cursor:default;}
.plan-svg .zone{cursor:pointer;transition:opacity .2s;}
.plan-svg .zone:hover rect,.plan-svg .zone:hover path{filter:brightness(1.15);}
.plan-svg .zone.highlighted rect{stroke:var(--gold) !important;stroke-width:2 !important;}
@keyframes pulse{0%,100%{stroke-opacity:.8;stroke-width:2;}50%{stroke-opacity:1;stroke-width:3;}}
.plan-svg .zone.pulse rect{animation:pulse .8s ease-in-out 3;}
.plan-svg text{pointer-events:none;font-family:'Raleway',sans-serif;}
/* layer visibility */
.plan-svg.hide-fashion .z-fashion{opacity:.12;}
.plan-svg.hide-gastro .z-gastro{opacity:.12;}
.plan-svg.hide-wellness .z-wellness{opacity:.12;}
.plan-svg.hide-beauty .z-beauty{opacity:.12;}
.plan-svg.hide-food .z-food{opacity:.12;}
.plan-svg.hide-service .z-service{opacity:.12;}

/* ── LAYER FILTERS ── */
.layer-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:rgba(250,248,243,.95);backdrop-filter:blur(8px);padding:7px 10px;border:1px solid var(--rule);}
.lyr-btn{background:transparent;border:1px solid transparent;padding:5px 12px;font-family:'Raleway',sans-serif;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted);}
.lyr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.lyr-btn.active{color:var(--ink);border-color:currentColor;}
.lyr-btn.active.cat-fashion{color:#356BA5;}
.lyr-btn.active.cat-gastro{color:#BA7517;}
.lyr-btn.active.cat-wellness{color:#0F6E56;}
.lyr-btn.active.cat-beauty{color:#993556;}
.lyr-btn.active.cat-food{color:#633806;}
.lyr-btn.active.cat-service{color:#5F5E5A;}

/* ── SIDE PANEL ── */
.side-panel{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease;}
.sp-default{padding:20px;display:flex;flex-direction:column;gap:16px;}
.sp-eyebrow{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);margin-bottom:4px;}
.sp-floor-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--bordo);line-height:1;}
.sp-floor-desc{font-size:12px;color:var(--muted);font-weight:300;line-height:1.7;}
.legend{display:flex;flex-direction:column;gap:6px;}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);}
.leg-swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0;}
.svc-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule);}
.svc-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink);}
.svc-row:last-child{border-bottom:none;}
.svc-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
/* zone card */
.sp-card{flex:1;overflow-y:auto;display:none;flex-direction:column;}
.sp-card.visible{display:flex;}
.sp-card-img{height:160px;overflow:hidden;position:relative;flex-shrink:0;}
.sp-card-img img{width:100%;height:100%;object-fit:cover;display:block;}
.sp-card-img-ph{width:100%;height:100%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:48px;}
.sp-card-img-back{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:none;color:#fff;font-size:12px;cursor:pointer;padding:5px 10px;letter-spacing:.04em;}
.sp-card-body{padding:18px;flex:1;}
.sp-cat{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px;}
.sp-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--bordo);line-height:1.05;margin-bottom:10px;}
.sp-desc{font-size:12px;color:var(--muted);font-weight:300;line-height:1.7;margin-bottom:14px;}
.sp-meta{display:flex;flex-direction:column;border-top:1px solid var(--rule);margin-bottom:14px;}
.sp-meta-row{display:flex;padding:7px 0;border-bottom:1px solid var(--rule);}
.sp-meta-row:last-child{border-bottom:none;}
.sp-mk{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:70px;padding-top:1px;}
.sp-mv{font-size:12px;color:var(--ink);line-height:1.4;}
.sp-open{font-size:11px;font-weight:600;padding:2px 8px;display:inline-block;margin-bottom:4px;}
.sp-open.open{background:rgba(61,153,112,.12);color:#0F6E56;}
.sp-open.closed{background:rgba(192,57,43,.1);color:#c0392b;}
.sp-actions{display:flex;flex-direction:column;gap:6px;padding:0 18px 18px;}
.btn-bordo{background:var(--bordo);color:#fff;border:none;padding:11px 18px;font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:var(--tr);width:100%;text-align:center;text-decoration:none;display:block;}
.btn-bordo:hover{background:#6B1024;}
.btn-outline-sm{background:transparent;border:1px solid var(--rule);color:var(--ink);padding:10px 18px;font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:var(--tr);width:100%;text-align:center;}
.btn-outline-sm:hover{border-color:var(--gold);background:var(--gold-p);}

/* ── MOBILE BOTTOM SHEET ── */
.mobile-sheet{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);z-index:300;transform:translateY(100%);transition:transform .3s ease;max-height:70vh;overflow-y:auto;border-radius:0;}
.mobile-sheet.peek{transform:translateY(calc(100% - 64px));}
.mobile-sheet.open{transform:translateY(0);}
.ms-handle{width:32px;height:3px;background:var(--rule);border-radius:2px;margin:10px auto 14px;}
.ms-mini{padding:0 16px 14px;display:flex;align-items:center;gap:12px;}
.ms-mini-icon{font-size:24px;}
.ms-mini-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--bordo);}
.ms-mini-floor{font-size:11px;color:var(--muted);}

/* ── YOU ARE HERE button ── */
.yah-btn{position:absolute;top:16px;right:16px;background:rgba(250,248,243,.95);border:1px solid var(--rule);padding:7px 14px;font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:6px;color:var(--deep);}
.yah-btn:hover{border-color:var(--gold);background:var(--gold-p);}
.yah-dot{width:8px;height:8px;border-radius:50%;background:#3B8BD4;flex-shrink:0;}

/* ── SVG ZONE STYLES ── */
.z-fashion rect,.z-fashion path{fill:var(--z-fashion);stroke:rgba(53,107,165,.4);stroke-width:.5;}
.z-fashion:hover rect,.z-fashion:hover path,.z-fashion.sel rect,.z-fashion.sel path{fill:var(--z-fashion-h);}
.z-gastro rect,.z-gastro path{fill:var(--z-gastro);stroke:rgba(186,117,23,.4);stroke-width:.5;}
.z-gastro:hover rect,.z-gastro:hover path,.z-gastro.sel rect,.z-gastro.sel path{fill:var(--z-gastro-h);}
.z-wellness rect,.z-wellness path{fill:var(--z-wellness);stroke:rgba(15,110,86,.4);stroke-width:.5;}
.z-wellness:hover rect,.z-wellness:hover path,.z-wellness.sel rect,.z-wellness.sel path{fill:var(--z-wellness-h);}
.z-beauty rect,.z-beauty path{fill:var(--z-beauty);stroke:rgba(153,53,86,.4);stroke-width:.5;}
.z-beauty:hover rect,.z-beauty:hover path,.z-beauty.sel rect,.z-beauty.sel path{fill:var(--z-beauty-h);}
.z-food rect,.z-food path{fill:var(--z-food);stroke:rgba(99,56,6,.35);stroke-width:.5;}
.z-food:hover rect,.z-food:hover path,.z-food.sel rect,.z-food.sel path{fill:var(--z-food-h);}
.z-service rect,.z-service path{fill:var(--z-service);stroke:rgba(95,94,90,.3);stroke-width:.5;}
.z-service:hover rect,.z-service:hover path,.z-service.sel rect,.z-service.sel path{fill:var(--z-service-h);}
.z-parking rect{fill:var(--z-parking);stroke:rgba(44,44,42,.25);stroke-width:.5;}
.z-parking:hover rect{fill:var(--z-parking-h);}
.zone-label{font-size:10px;font-weight:500;fill:rgba(15,12,8,.65);}
.zone-sub{font-size:8px;font-weight:400;fill:rgba(15,12,8,.4);}
/* service icons */
.svc-icon-svg{font-size:12px;fill:rgba(95,94,90,.7);}
/* building outline */
.building-wall{fill:rgba(15,12,8,.04);stroke:rgba(15,12,8,.15);stroke-width:1;}
.core-wall{fill:rgba(15,12,8,.07);stroke:rgba(15,12,8,.2);stroke-width:.5;}
/* corridors/atriums */
.corridor{fill:rgba(250,248,243,.7);stroke:rgba(15,12,8,.06);stroke-width:.5;}
/* escalator symbol */
.esc-sym{fill:none;stroke:rgba(95,94,90,.5);stroke-width:.8;}
.lift-sym{fill:rgba(95,94,90,.12);stroke:rgba(95,94,90,.45);stroke-width:.5;}

@media(max-width:768px){
  .side-panel{display:none;}
  .floor-switcher{width:52px;}
  .fb-label{display:none;}
  .floor-btn{width:40px;height:40px;}
  .fb-num{font-size:15px;}
  .layer-bar{gap:3px;padding:5px 6px;}
  .lyr-btn span:not(.lyr-dot){display:none;}
  .mobile-sheet{display:block;}
  .yah-btn span:last-child{display:none;}
  html,body{height:100%;overflow:hidden;}
  .page-body{height:calc(100vh - 62px - 88px - env(safe-area-inset-bottom));}
}
</style>
</head>

  <div class="navbar">

  <svg class="sb-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10 10l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>

<!-- MAIN -->

  <!-- PLAN CANVAS -->
  <div class="plan-area" id="planArea">

    <!-- FLOOR 2 — default -->

      <svg class="plan-svg" id="svg-2" viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">

        <rect class="building-wall" x="20" y="20" width="520" height="380" rx="16"/>

  {id:'wc4',name:'Туалет',floor:'4',category:'service'},{id:'wc5',name:'Туалет',floor:'5',category:'service'},
  {id:'atm1',name:'Банкомат',floor:'1',category:'service'},{id:'info1',name:'Информационная стойка',floor:'1',category:'service'},
  {id:'parkentry',name:'Въезд на паркинг',floor:'0',category:'service'},{id:'p1a',name:'Паркинг зона A',floor:'-1',category:'service'},
  {id:'p1c',name:'Паркинг МГН',floor:'-1',category:'service'},
];

let currentFloor='2';

function setFloor(f){
  currentFloor=f;
  document.querySelectorAll('.floor-btn').forEach(b=>b.classList.toggle('active',b.dataset.floor===f));
  document.querySelectorAll('.floor-plan').forEach(p=>p.classList.remove('active'));
  const plan=document.getElementById('plan-'+f);
  if(plan)plan.classList.add('active');
  clearZone();
  renderDefault(f);
}

function renderDefault(f){
  const m=FLOOR_META[f]||{title:f+' этаж',desc:'',svcs:[]};
  const spd=document.getElementById('spDefault');
  spd.innerHTML=`
    <div><div class="sp-eyebrow">Этаж ${f}</div><div class="sp-floor-title">${m.title}</div></div>
    <div class="sp-floor-desc">${m.desc}</div>
    ${m.svcs.length?`<div>
      <div class="sp-eyebrow" style="margin-bottom:8px;">Сервисы этажа</div>
      <div class="svc-list">${m.svcs.map(s=>`<div class="svc-row"><span class="svc-icon">${svcIcon(s)}</span>${s}</div>`).join('')}</div>
    </div>`:''}
    <div>
      <div class="sp-eyebrow" style="margin-bottom:10px;">Цветовая легенда</div>
      <div class="legend">
        <div class="leg-row"><div class="leg-swatch" style="background:rgba(53,107,165,.5);"></div>Мода и бренды</div>
        <div class="leg-row"><div class="leg-swatch" style="background:rgba(186,117,23,.5);"></div>Рестораны и кафе</div>
        <div class="leg-row"><div class="leg-swatch" style="background:rgba(15,110,86,.5);"></div>Велнес и СПА</div>
        <div class="leg-row"><div class="leg-swatch" style="background:rgba(153,53,86,.5);"></div>Красота</div>
        <div class="leg-row"><div class="leg-swatch" style="background:rgba(99,56,6,.45);"></div>Продукты</div>
        <div class="leg-row"><div class="leg-swatch" style="background:rgba(95,94,90,.4);"></div>Сервисы</div>
      </div>
    </div>`;
}

function svcIcon(s){
  if(s.includes('Туалет'))return'🚻';
  if(s.includes('Лифт'))return'🛗';
  if(s.includes('Эскалат'))return'↕';
  if(s.includes('Банком'))return'🏧';
  if(s.includes('Инфо')||s.includes('стойка'))return'ℹ';
  if(s.includes('Паркинг')||s.includes('Въезд'))return'🚗';
  if(s.includes('МГН')||s.includes('Доступ'))return'♿';
  if(s.includes('Примероч'))return'👗';
  if(s.includes('Ресепшн'))return'👋';
  return'📍';
}

function selectZone(id){
  const z=ZONES[id];
  if(!z)return;
  // highlight
  document.querySelectorAll('.zone').forEach(el=>el.classList.remove('sel'));
  const el=document.getElementById('z-'+id);
  if(el){el.classList.add('sel','pulse');setTimeout(()=>el.classList.remove('pulse'),2500);}

  // side panel
  document.getElementById('spDefault').style.display='none';
  const card=document.getElementById('spCard');
  card.classList.add('visible');
  const h=document.getElementById('spImg');
  h.innerHTML=`<button class="sp-card-img-back" onclick="clearZone()">← ${FLOOR_META[currentFloor]?.title||'Этаж'}</button>`;
  if(z.img){h.innerHTML+=`<img src="${z.img}" alt="${z.name}" style="width:100%;height:100%;object-fit:cover;display:block;">`;}
  else{h.innerHTML+=`<div class="sp-card-img-ph">🏪</div>`;}

  const now=new Date().getHours();
  const openUntil=z.hours?parseInt(z.hours.split('–')[1]||'22'):22;
  const openFrom=z.hours?parseInt(z.hours.split(':')[0]||'10'):10;
  const isOpen=now>=openFrom&&now<openUntil;
  const openLabel=z.hours&&z.hours.includes('запись')?'По записи':z.hours&&z.hours.includes('Круглосуточно')?'Круглосуточно':z.hours&&z.hours.includes('приглаш')?'Только по приглашению':isOpen?'Открыто':'Закрыто';
  const openClass=isOpen||z.hours?.includes('Круглосуточно')?'open':'closed';

  document.getElementById('spBody').innerHTML=`
    <div class="sp-cat">${z.cat}</div>
    <div class="sp-name">${z.name}</div>
    ${z.desc?`<div class="sp-desc">${z.desc}</div>`:''}
    <div class="sp-meta">
      ${z.floor?`<div class="sp-meta-row"><span class="sp-mk">Этаж</span><span class="sp-mv">${z.floor}</span></div>`:''}
      ${z.hours?`<div class="sp-meta-row"><span class="sp-mk">Часы</span><span class="sp-mv"><span class="sp-open ${openClass}">${openLabel}</span><br>${z.hours}</span></div>`:''}
      ${z.phone?`<div class="sp-meta-row"><span class="sp-mk">Телефон</span><span class="sp-mv">${z.phone}</span></div>`:''}
    </div>`;

  document.getElementById('spActions').innerHTML=`
    ${z.link?`<a href="${z.link}" class="btn-bordo">Подробнее →</a>`:''}
    <button class="btn-outline-sm" onclick="alert('Маршрут: ${z.name}')">📍 Проложить маршрут</button>`;

  // mobile sheet
  const ms=document.getElementById('mobileSheet');
  document.getElementById('msMini').innerHTML=`<span class="ms-mini-icon">${z.img?'🏪':'📍'}</span><div><div class="ms-mini-name">${z.name}</div><div class="ms-mini-floor">${z.cat} · ${z.floor||currentFloor} этаж</div></div>`;
  document.getElementById('msContent').style.display='none';
  ms.classList.remove('open');
  ms.classList.add('peek');
}

function expandSheet(){
  const ms=document.getElementById('mobileSheet');
  const cnt=document.getElementById('msContent');
  if(ms.classList.contains('open')){return;}
  ms.classList.add('open');
  cnt.style.display='block';
}

function clearZone(){
  document.getElementById('spDefault').style.display='';
  document.getElementById('spCard').classList.remove('visible');
  document.querySelectorAll('.zone').forEach(el=>el.classList.remove('sel'));
  document.getElementById('mobileSheet').classList.remove('peek','open');
}

function toggleLayer(btn){
  btn.classList.toggle('active');
  const layer=btn.dataset.layer;
  const svgs=document.querySelectorAll('.plan-svg');
  svgs.forEach(svg=>svg.classList.toggle('hide-'+layer,!btn.classList.contains('active')));
}

// Search
const si=document.getElementById('sbInput');
const acDrop=document.getElementById('acDrop');
si.addEventListener('input',()=>{
  const q=si.value.toLowerCase().trim();
  document.getElementById('sbClear').classList.toggle('vis',!!q);
  if(!q){acDrop.classList.remove('vis');return;}
  const res=SEARCH_INDEX.filter(x=>x.name.toLowerCase().includes(q)).slice(0,6);
  if(!res.length){acDrop.classList.remove('vis');return;}
  acDrop.innerHTML=res.map(r=>`<div class="ac-item" onclick="searchGo('${r.id}','${r.floor}')"><span class="ac-name">${r.name}</span><span class="ac-floor">Этаж ${r.floor}</span></div>`).join('');
  acDrop.classList.add('vis');
});
document.getElementById('sbClear').addEventListener('click',()=>{si.value='';document.getElementById('sbClear').classList.remove('vis');acDrop.classList.remove('vis');});
document.addEventListener('click',e=>{if(!e.target.closest('#searchWrap'))acDrop.classList.remove('vis');});

function quickSearch(q){si.value=q;si.dispatchEvent(new Event('input'));}

function searchGo(id,floor){
  acDrop.classList.remove('vis');
  si.value='';document.getElementById('sbClear').classList.remove('vis');
  setFloor(floor);
  setTimeout(()=>selectZone(id),80);
}

function locateMe(){
  const floors=['1','2','4'];
  const f=floors[Math.floor(Math.random()*floors.length)];
  setFloor(f);
  // simulate pulse at center
  const plan=document.getElementById('plan-'+f);
  if(!plan)return;
  const indicator=document.createElement('div');
  indicator.style.cssText='position:absolute;top:50%;left:50%;width:14px;height:14px;background:#3B8BD4;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(59,139,212,.25);pointer-events:none;z-index:10;';
  document.getElementById('planArea').appendChild(indicator);
  setTimeout(()=>indicator.remove(),3000);
  alert(`Вы определены на ${f} этаже (примерная локация)`);
}

// Burger
const bb=document.getElementById('bb'),ov=document.getElementById('ov'),sd=document.getElementById('side'),sc=document.getElementById('sc');
bb.addEventListener('click',()=>{sd.classList.add('open');ov.classList.add('open');document.body.style.overflow='hidden';});
[sc,ov].forEach(el=>el.addEventListener('click',()=>{sd.classList.remove('open');ov.classList.remove('open');document.body.style.overflow='';}));
document.querySelectorAll('.side a').forEach(a=>a.addEventListener('click',()=>{sd.classList.remove('open');ov.classList.remove('open');document.body.style.overflow='';}));

// Init
renderDefault('2');
</script>
</body>
</html>
